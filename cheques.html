<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5fa8">
<title>Control de cheques · Olalac</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#14202e;--mu:#5d6b7b;--lin:#dfe4ea;--ac:#0f5fa8;--ok:#138a52;--okb:#e3f6ec;--wa:#a86a00;--wab:#fff3d6;--ko:#c0352b;--kob:#fde6e4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1016;--card:#141c26;--tx:#e8eef4;--mu:#93a2b3;--lin:#243243;--ac:#4ea8ff;--ok:#3ddc97;--okb:#0f2c20;--wa:#ffb020;--wab:#33270b;--ko:#ff6b6b;--kob:#3a1716}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--ac);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}header small{opacity:.85}
main{padding:16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--lin);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:700;margin:4px 0 6px}
input[type=text],input[type=password],input[type=tel]{width:100%;font-size:17px;padding:12px;border-radius:10px;border:1px solid var(--lin);background:var(--bg);color:var(--tx)}
.foto{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;border:2px dashed var(--lin);border-radius:12px;min-height:130px;margin:8px 0 14px;cursor:pointer;overflow:hidden;position:relative;text-align:center;padding:10px}
.foto img{max-width:100%;max-height:220px;border-radius:8px}
.foto .t{font-weight:800;font-size:17px}.foto .s{color:var(--mu);font-size:14px}
.foto input{display:none}
button.big{width:100%;font-size:19px;font-weight:800;padding:16px;border:0;border-radius:12px;background:var(--ac);color:#fff;cursor:pointer}
button.big:disabled{opacity:.45}
button.sec{width:100%;font-size:16px;font-weight:700;padding:13px;border:1px solid var(--lin);border-radius:12px;background:var(--card);color:var(--tx);margin-top:10px}
.mu{color:var(--mu);font-size:14px}
.res{border-radius:14px;padding:18px;margin-bottom:14px;border:2px solid}
.res h2{margin:0 0 6px;font-size:26px}
.res.OK{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.res.REVISAR{background:var(--wab);border-color:var(--wa);color:var(--wa)}
.res.NO,.res.FOTO{background:var(--kob);border-color:var(--ko);color:var(--ko)}
.res p{margin:4px 0;color:var(--tx);font-weight:600}
ul.m{margin:8px 0 0;padding-left:20px}ul.m li{margin:6px 0;color:var(--tx)}
li.no::marker{color:var(--ko)}li.rv::marker{color:var(--wa)}li.ok::marker{color:var(--ok)}
.dato{display:flex;justify-content:space-between;border-bottom:1px solid var(--lin);padding:7px 0;font-size:15px}.dato span:first-child{color:var(--mu)}
.spin{width:46px;height:46px;border:5px solid var(--lin);border-top-color:var(--ac);border-radius:50%;animation:g 1s linear infinite;margin:10px auto}
@keyframes g{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
.link{background:none;border:0;color:#fff;text-decoration:underline;font-size:14px}
</style>
</head>
<body>
<header><div><b>Control de cheques</b><br><small id="quien"></small></div><button class="link" id="cambiar" hidden>cambiar</button></header>
<main>

<section id="vConfig" class="card" hidden>
  <label for="nombre">Tu nombre</label>
  <input id="nombre" type="text" placeholder="Ej. Carlos" autocomplete="name">
  <label for="pin" style="margin-top:12px">PIN (te lo da la oficina)</label>
  <input id="pin" type="tel" inputmode="numeric" placeholder="••••">
  <p class="mu" id="cfgMsg"></p>
  <button class="big" id="guardar">Entrar</button>
</section>

<section id="vFoto" hidden>
  <div class="card">
    <label for="cliente">Cliente (código o nombre)</label>
    <input id="cliente" type="text" placeholder="Opcional, pero ayuda a la oficina">
    <label style="margin-top:14px">1. Foto del FRENTE</label>
    <label class="foto" id="zF"><input type="file" accept="image/*" capture="environment" id="fF">
      <span class="t">📷 Sacar foto del frente</span><span class="s">Derecho, que entre todo el cheque, con buena luz y sin reflejo</span></label>
    <label>2. Foto del DORSO</label>
    <label class="foto" id="zD"><input type="file" accept="image/*" capture="environment" id="fD">
      <span class="t">📷 Sacar foto del dorso</span><span class="s">Para ver endosos y firmas</span></label>
    <button class="big" id="enviar" disabled>REVISAR CHEQUE</button>
  </div>
</section>

<section id="vEsperando" class="card" hidden style="text-align:center">
  <div class="spin"></div><b>Revisando el cheque…</b><p class="mu">Tarda entre 10 y 30 segundos. No cierres la página.</p>
</section>

<section id="vRes" hidden>
  <div class="res" id="res"></div>
  <div class="card" id="datos"></div>
  <button class="big" id="otro">Revisar otro cheque</button>
</section>

</main>
<script>
const URL_CHEQUES = 'https://script.google.com/macros/s/AKfycbwO4L42T6elhJVeSKIGo2KdwEBrxBrosk8FUHOCXBejukrrslIs6I7WXA6U8P3AuTz4Dg/exec';
const $ = id => document.getElementById(id);
const ls = {get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let cfg = {nombre: ls.get('chq_nombre'), pin: ls.get('chq_pin')};
let img = {frente: '', dorso: ''};

function ver(v){ ['vConfig','vFoto','vEsperando','vRes'].forEach(x => $(x).hidden = x !== v); window.scrollTo(0,0); }
function inicio(){
  $('quien').textContent = cfg.nombre ? 'Repartidor: ' + cfg.nombre : 'Olalac';
  $('cambiar').hidden = !cfg.nombre;
  if (!cfg.nombre || !cfg.pin) { $('nombre').value = cfg.nombre; ver('vConfig'); } else ver('vFoto');
}
$('cambiar').onclick = () => { $('nombre').value = cfg.nombre; $('pin').value = ''; ver('vConfig'); };
$('guardar').onclick = async () => {
  const n = $('nombre').value.trim(), p = $('pin').value.trim();
  if (!n || !p) { $('cfgMsg').textContent = 'Completá tu nombre y el PIN.'; return; }
  $('cfgMsg').textContent = 'Verificando…';
  try {
    const r = await (await fetch(URL_CHEQUES, {method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({tipo:'ping', pin:p})})).json();
    if (!r.ok) { $('cfgMsg').textContent = r.error || 'No se pudo verificar'; return; }
  } catch (e) { $('cfgMsg').textContent = 'Sin conexión. Probá de nuevo.'; return; }
  cfg = {nombre: n, pin: p}; ls.set('chq_nombre', n); ls.set('chq_pin', p); $('cfgMsg').textContent = ''; inicio();
};

// achica la foto (máx 1600 px) para que viaje rápido con datos móviles
function achicar(file){
  return new Promise((ok, mal) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', 0.82)); }; im.onerror = mal; im.src = fr.result; };
    fr.onerror = mal; fr.readAsDataURL(file);
  });
}
function cargarFoto(inp, zona, clave){
  inp.onchange = async () => {
    if (!inp.files[0]) return;
    const url = await achicar(inp.files[0]);
    img[clave] = url.split(',')[1];
    zona.querySelectorAll('img,.t,.s').forEach(e => e.remove());
    zona.insertAdjacentHTML('beforeend', '<img alt="foto"><span class="s">Tocá para sacarla de nuevo</span>');
    zona.querySelector('img').src = url;
    $('enviar').disabled = !img.frente;
  };
}
cargarFoto($('fF'), $('zF'), 'frente');
cargarFoto($('fD'), $('zD'), 'dorso');

const TIT = {OK:'✅ ACEPTAR', REVISAR:'⚠️ REVISAR', NO:'❌ NO ACEPTAR', FOTO:'📷 SACÁ LA FOTO DE NUEVO'};
const SUB = {OK:'El cheque está bien.', REVISAR:'Antes de aceptarlo, llamá a la oficina.', NO:'No lo recibas. Explicale al cliente el motivo:', FOTO:'No se pudo leer el cheque.'};
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const plata = n => n == null ? '—' : '$ ' + Number(n).toLocaleString('es-AR', {maximumFractionDigits: 2});

$('enviar').onclick = async () => {
  ver('vEsperando');
  try {
    const r = await (await fetch(URL_CHEQUES, {method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({tipo:'cheque', pin: cfg.pin, repartidor: cfg.nombre, cliente: $('cliente').value.trim(), frente: img.frente, dorso: img.dorso})})).json();
    if (!r.ok) throw new Error(r.error || 'error');
    const lis = r.no.map(x => '<li class="no">' + esc(x) + '</li>').join('') + r.revisar.map(x => '<li class="rv">' + esc(x) + '</li>').join('')
              + (r.resultado === 'OK' ? r.bien.map(x => '<li class="ok">' + esc(x) + '</li>').join('') : '');
    $('res').className = 'res ' + r.resultado;
    $('res').innerHTML = '<h2>' + TIT[r.resultado] + '</h2><p>' + SUB[r.resultado] + '</p><ul class="m">' + lis + '</ul>';
    const c = r.cheque || {};
    $('datos').innerHTML = '<b>Lo que se leyó del cheque</b>' + [['Banco', c.banco], ['N°', c.numero], ['Importe', plata(c.importe)],
      ['Fecha de pago', (c.fecha_pago || '—') + (c.dias != null ? ' (' + (c.dias > 0 ? 'a ' + c.dias + ' días' : 'al día') + ')' : '')],
      ['Librador', c.librador], ['CUIT', c.cuit]].map(x => '<div class="dato"><span>' + x[0] + '</span><span>' + esc(x[1] || '—') + '</span></div>').join('')
      + '<p class="mu">Si algún dato está mal leído, avisá a la oficina. Queda guardado con la foto.</p>';
    if (r.resultado === 'FOTO') $('otro').textContent = 'Sacar la foto de nuevo'; else $('otro').textContent = 'Revisar otro cheque';
    $('otro').dataset.r = r.resultado;
    ver('vRes');
  } catch (e) {
    $('res').className = 'res NO'; $('res').innerHTML = '<h2>Sin respuesta</h2><p>No se pudo revisar (' + esc(e.message) + '). Revisá la señal y probá de nuevo.</p>';
    $('datos').innerHTML = ''; $('otro').textContent = 'Probar de nuevo'; $('otro').dataset.r = 'FOTO'; ver('vRes');
  }
};
$('otro').onclick = () => {
  if ($('otro').dataset.r !== 'FOTO') {
    img = {frente: '', dorso: ''}; $('cliente').value = ''; $('enviar').disabled = true;
    [['zF','frente','Sacar foto del frente','Derecho, que entre todo el cheque, con buena luz y sin reflejo'],['zD','dorso','Sacar foto del dorso','Para ver endosos y firmas']].forEach(([z,_,t,s]) => {
      const el = $(z); el.querySelectorAll('img,.t,.s').forEach(e => e.remove());
      el.insertAdjacentHTML('beforeend', '<span class="t">📷 ' + t + '</span><span class="s">' + s + '</span>'); el.querySelector('input').value = '';
    });
  }
  ver('vFoto');
};
inicio();
</script>
</body>
</html>
