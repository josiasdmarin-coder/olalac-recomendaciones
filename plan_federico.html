<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Plan de visitas - Federico</title>
<style>
:root{--azul:#1565c0;--azul-cl:#e3eefb;--bg:#eef1f5;--txt:#1b2430;--sub:#6b7686;--borde:#e1e6ee;--verde:#1a8a4a;--rojo:#c0392b;--sombra:0 1px 3px rgba(20,40,80,.08)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:-apple-system,system-ui,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--txt);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.app{max-width:900px;margin:0 auto;padding-bottom:96px}
.appbar{position:sticky;top:0;z-index:50;background:var(--azul);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
.ab-logo{width:36px;height:36px;border-radius:10px;background:#fff;color:var(--azul);font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ab-txt{min-width:0;flex:1}
.ab-title{font-size:17px;font-weight:700;line-height:1.2}
.ab-sub{font-size:12.5px;opacity:.88;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-s{background:var(--azul);height:30px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;background:#fff;border:1px solid var(--borde);font-size:13px;color:var(--sub);cursor:pointer;font-weight:500;white-space:nowrap}
.chip.on{background:var(--azul);border-color:var(--azul);color:#fff}
.pl-ctl{margin:-18px 16px 0;display:grid;gap:10px;position:relative}
.pl-tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 16px 0}
.pl-tot div{background:#fff;border-radius:10px;padding:8px;text-align:center;box-shadow:var(--sombra)}
.pl-tot b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.pl-tot small{font-size:11.5px;color:var(--sub)}
.pl-sw-row{display:flex;gap:12px;align-items:center;margin:12px 16px 0;background:#fff;border-radius:12px;padding:10px 14px;box-shadow:var(--sombra);cursor:pointer}
.pl-sw-row b{font-size:14px;display:block}.pl-sw-row small{font-size:12px;color:var(--sub)}.pl-sw-row div{min-width:0;flex:1}
.pl-sw{width:40px;height:24px;border-radius:12px;background:#cfd6df;position:relative;flex:none;transition:background .15s}
.pl-sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.pl-sw.on{background:var(--rojo)}.pl-sw.on i{left:19px}
.pl-sw.gps.on{background:var(--azul)}
.pl-ley{display:flex;flex-wrap:wrap;gap:10px 14px;margin:10px 16px 0;font-size:12.5px;color:var(--sub)}
.pl-ley span{display:flex;align-items:center;gap:5px}
.pl-dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.pl-x{color:var(--rojo);font-style:normal;font-weight:800}
.pl-map-w{position:relative;margin:12px 16px 0}
.pl-map{height:52vh;min-height:300px;border-radius:12px;overflow:hidden;box-shadow:var(--sombra);background:#dfe5ec}
.pl-yo-btn{position:absolute;right:10px;bottom:24px;z-index:500;background:#fff;border:none;border-radius:22px;padding:9px 14px;font-weight:700;font-size:13px;color:var(--azul);box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
.pl-lst{margin:12px 16px 0;border-radius:12px;overflow:hidden;box-shadow:var(--sombra)}
.pl-it{display:flex;gap:10px;align-items:center;background:#fff;padding:10px 12px 10px 14px;border-bottom:1px solid var(--borde)}
.pl-it .pl-inf{min-width:0;flex:1;cursor:pointer}
.pl-it b{font-size:14px;display:block}.pl-it small{font-size:12px;color:var(--sub)}
.pl-it .km{font-weight:700;color:var(--azul)}
.pl-ir{flex:none;padding:8px 12px;border-radius:9px;background:var(--verde);color:#fff;font-weight:700;font-size:13px;text-decoration:none}
.pl-orden{display:flex;justify-content:space-between;align-items:center;margin:16px 16px 0;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--sub)}
.pl-orden span.lk{color:var(--azul);cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px}
.empty{text-align:center;padding:2rem 1rem;color:#9aa4b2;font-size:14px;background:#fff}
.bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.08);padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;max-width:900px;margin:0 auto}
.bb-btn{flex:1;padding:15px 8px;font-size:16px;font-weight:800;border:none;border-radius:6px;color:#fff;background:var(--verde);cursor:pointer;letter-spacing:.02em}
.bb-btn:disabled{background:#b8c0cc}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:600px;max-height:85vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font-size:17px;margin-bottom:4px}.sheet p{font-size:13px;color:var(--sub);margin-bottom:12px}
.sheet ol{margin:0 0 14px 20px;font-size:13.5px}.sheet li{padding:3px 0}
.tramos{display:flex;flex-direction:column;gap:8px}
.tramos a{padding:13px;border-radius:10px;background:var(--azul);color:#fff;font-weight:700;text-decoration:none;font-size:15px;text-align:center}
.sheet .cerrar{margin-top:12px;width:100%;padding:12px;border:1px solid var(--borde);background:#fff;border-radius:10px;font-weight:700;font-size:14px;color:var(--sub)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#1b2430;color:#fff;padding:10px 16px;border-radius:20px;font-size:13.5px;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.pl-pop{font-family:inherit;font-size:12.5px;line-height:1.45;max-width:240px}.pl-pop b{font-size:14px}
.pl-pop a{display:inline-block;margin-top:6px;font-weight:700;color:#1565c0;text-decoration:none}
.pl-xm{color:#c0392b;font-weight:900;font-size:15px;line-height:16px;text-align:center;text-shadow:0 0 2px #fff,0 0 2px #fff}
.yo-m{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
.pin-bg{position:fixed;inset:0;background:linear-gradient(160deg,#1565c0 0%,#0d47a1 100%);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.pin-card{background:#fff;border-radius:20px;padding:30px 24px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:330px;width:100%}
.pin-logo{width:60px;height:60px;border-radius:16px;background:var(--azul);color:#fff;font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.pin-input{width:100%;padding:13px;font-size:20px;letter-spacing:6px;text-align:center;border:2px solid var(--borde);border-radius:12px;margin:0 0 12px;outline:none}
.pin-btn{width:100%;padding:13px;font-size:15px;font-weight:600;background:var(--azul);color:#fff;border:none;border-radius:12px;cursor:pointer}
</style>
</head>

<div class="app" id="app" style="display:none"></div>

<p style="font-size:14px;color:#6b7686;margin:0 0 18px">Federico</p>

      var m = new gm.Marker({ map: plMapa, position: { lat: p.la, lng: p.lo }, title: p.n, zIndex: 5,
        icon: { path: gm.SymbolPath.CIRCLE, scale: p.f === 'Semanal' ? 9 : 7, fillColor: men ? '#ffffff' : col, fillOpacity: 1, strokeColor: men ? col : '#ffffff', strokeWeight: men ? 3 : 2 } });
      var abrir = function() { info.setContent(plPopup(p)); info.open(plMapa, m); };
      m.addListener('click', abrir);
      plCapa.push({ c: p.c, m: m, abrir: function() { plMapa.setCenter(m.getPosition()); plMapa.setZoom(16); abrir(); } });
      b.extend(m.getPosition());
    });
    if (pts.length > 1) plMapa.fitBounds(b, 30); else if (pts.length) { plMapa.setCenter(b.getCenter()); plMapa.setZoom(16); }
  } else if (window.L) {
    plMapa = L.map(el, { zoomControl: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(plMapa);
    var icoX = L.divIcon({ className: 'pl-xm', html: '✕', iconSize: [16, 16], iconAnchor: [8, 8] });
    otros.forEach(function(o) { L.marker([o.la, o.lo], { icon: icoX, zIndexOffset: -500 }).bindPopup(plPopupOtro(o)).addTo(plMapa); });
    var ll = [];
    pts.forEach(function(p) {
      var men = p.f === 'Mensual', col = colorPlan(p);
      var m = L.circleMarker([p.la, p.lo], { radius: p.f === 'Semanal' ? 9 : 7, color: men ? col : '#fff', weight: men ? 3 : 2, fillColor: men ? '#fff' : col, fillOpacity: 1 })
        .bindPopup(function() { return plPopup(p); }).addTo(plMapa);
      plCapa.push({ c: p.c, m: m, abrir: function() { plMapa.setView(m.getLatLng(), 16); m.openPopup(); } });
      ll.push([p.la, p.lo]);
    });
    if (ll.length) plMapa.fitBounds(ll, { padding: [30, 30], maxZoom: 16 }); else plMapa.setView([-37.32, -59.13], 13);
  }
  moverYo();
}
function moverYo() {
  if (!yo || !plMapa) return;
  if (usaGoogle()) {
    if (!yoMarker) yoMarker = new google.maps.Marker({ map: plMapa, zIndex: 10, title: 'Vos',
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: '#1a73e8', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 3 } });
    yoMarker.setPosition({ lat: yo.la, lng: yo.lo });
  } else if (window.L) {
    if (!yoMarker) yoMarker = L.marker([yo.la, yo.lo], { icon: L.divIcon({ className: '', html: '<div class="yo-m"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), zIndexOffset: 1000 }).bindPopup('Estás acá').addTo(plMapa);
    else yoMarker.setLatLng([yo.la, yo.lo]);
  }
}
function centrarYo() {
  if (!yo) { iniciarGPS(); toast(gpsEstado === 'denegado' ? 'Habilitá la ubicación para esta página' : 'Buscando tu ubicación…'); return; }
  if (usaGoogle()) { plMapa.setCenter({ lat: yo.la, lng: yo.lo }); plMapa.setZoom(16); }
  else if (plMapa) plMapa.setView([yo.la, yo.lo], 16);
}
function plVer(id) {
  var x = plCapa.filter(function(k) { return k.c === id; })[0];
  if (!x) { toast('Este cliente no tiene ubicación en el mapa'); return; }
  x.abrir();
  document.getElementById('plMap').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ---------- Recorrido: desde donde esta el vendedor, el mas corto, en Google Maps ---------- */
function dist(a, b) { var dy = (a.la - b.la) * 111, dx = (a.lo - b.lo) * 111 * Math.cos(a.la * Math.PI / 180); return Math.sqrt(dx * dx + dy * dy); }
function ordenar(origen, P) {
  var resto = P.slice(), orden = [], act = origen || null;
  if (!act) { act = resto.shift(); orden.push(act); }
  while (resto.length) {
    var mi = 0; for (var i = 1; i < resto.length; i++) if (dist(act, resto[i]) < dist(act, resto[mi])) mi = i;
    act = resto.splice(mi, 1)[0]; orden.push(act);
  }
  var largo = function(o) { var t = origen ? dist(origen, o[0]) : 0; for (var k = 1; k < o.length; k++) t += dist(o[k - 1], o[k]); return t; };
  var mejoro = true, vueltas = 0;
  while (mejoro && vueltas++ < 50) {
    mejoro = false;
    for (var a = 0; a < orden.length - 1; a++) for (var b = a + 1; b < orden.length; b++) {
      var nuevo = orden.slice(0, a).concat(orden.slice(a, b + 1).reverse(), orden.slice(b + 1));
      if (largo(nuevo) < largo(orden) - 0.001) { orden = nuevo; mejoro = true; }
    }
  }
  return { orden: orden, km: largo(orden) * 1.3 };
}
function armarRecorrido() {
  var P = plFiltrados().filter(function(p) { return p.la != null; });
  if (!P.length) return;
  var r = ordenar(yo, P), o = r.orden, f = function(p) { return p.la.toFixed(6) + ',' + p.lo.toFixed(6); };
  var tramos = [], desde = yo, i = 0;
  while (i < o.length) {
    var parte = o.slice(i, i + 10);
    var u = 'https://www.google.com/maps/dir/?api=1&travelmode=driving' + (desde ? '&origin=' + f(desde) : '') + '&destination=' + f(parte[parte.length - 1]);
    var medio = parte.slice(0, -1); if (medio.length) u += '&waypoints=' + encodeURIComponent(medio.map(f).join('|'));
    tramos.push({ u: u, a: i + 1, b: i + parte.length });
    desde = parte[parte.length - 1]; i += parte.length;
  }
  var html = '<div class="sheet-bg" id="sheet" onclick="if(event.target===this)this.remove()"><div class="sheet">' +
    '<h3>Recorrido de ' + o.length + ' clientes · ~' + Math.round(r.km) + ' km</h3>' +
    '<p>' + (yo ? 'Arranca desde donde estás ahora.' : 'Sin tu ubicación: arranca por el primer cliente. Activá "Mi ubicación" para salir desde donde estás.') + '</p><ol>' +
    o.map(function(p) { return '<li>' + esc(p.n) + ' <span style="color:#6b7686">· ' + esc(p.dir || '') + '</span></li>'; }).join('') + '</ol>' +
    '<div class="tramos">' + tramos.map(function(t, k) { return '<a href="' + t.u + '" target="_blank" rel="noopener">Abrir en Google Maps' + (tramos.length > 1 ? ' · tramo ' + (k + 1) + ' (paradas ' + t.a + ' a ' + t.b + ')' : '') + '</a>'; }).join('') + '</div>' +
    '<button class="cerrar" onclick="document.getElementById(\'sheet\').remove()">Cerrar</button></div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
}

try { if (sessionStorage.getItem('plan_ok') === '1') { document.getElementById('pinScreen').style.display = 'none'; document.getElementById('app').style.display = 'block'; renderMapa(); iniciarGPS(); } } catch(e) {}
