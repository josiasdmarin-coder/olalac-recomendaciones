<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>Góndola Arcor · Olalac</title>
<style>
:root{--bg:#f4f4f6;--card:#fff;--tx:#17191f;--mu:#646b78;--lin:#e2e4ea;--ac:#c8102e;--ok:#138a52;--wa:#a86a00;--ko:#c0352b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f14;--card:#171a22;--tx:#eceef2;--mu:#99a1ae;--lin:#272b36;--ac:#ff4d63;--ok:#3ddc97;--wa:#ffb020;--ko:#ff6b6b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--ac);color:#fff;padding:14px 16px}header b{font-size:18px}header small{display:block;opacity:.85}
main{padding:16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--lin);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:700;margin:4px 0 6px}
input[type=text],input[type=tel]{width:100%;font-size:17px;padding:12px;border-radius:10px;border:1px solid var(--lin);background:var(--bg);color:var(--tx)}
.foto{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;border:2px dashed var(--lin);border-radius:12px;min-height:150px;margin:8px 0 14px;cursor:pointer;text-align:center;padding:10px}
.foto img{max-width:100%;max-height:260px;border-radius:8px}.foto .t{font-weight:800}.foto .s{color:var(--mu);font-size:14px}.foto input{display:none}
button.big{width:100%;font-size:19px;font-weight:800;padding:16px;border:0;border-radius:12px;background:var(--ac);color:#fff}
button.big:disabled{opacity:.45}
.mu{color:var(--mu);font-size:14px}
.share{text-align:center;padding:10px 0 4px}.share .n{font-size:56px;font-weight:900;color:var(--ac);line-height:1}.share .l{color:var(--mu)}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:15px}.bar .nm{width:120px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{flex:1;background:var(--lin);border-radius:6px;height:14px;overflow:hidden}.bar .fi{height:100%;background:var(--mu)}.bar .fi.a{background:var(--ac)}
.bar .v{width:34px;text-align:right;font-weight:700}
ul{padding-left:20px;margin:6px 0}li{margin:5px 0}
.pill{display:inline-block;font-size:13px;font-weight:800;padding:3px 10px;border-radius:12px;margin:2px 4px 2px 0}
.si{background:rgba(19,138,82,.14);color:var(--ok)}.no{background:rgba(192,53,43,.12);color:var(--ko)}
.spin{width:46px;height:46px;border:5px solid var(--lin);border-top-color:var(--ac);border-radius:50%;animation:g 1s linear infinite;margin:10px auto}@keyframes g{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><b>Góndola Arcor</b><small id="quien">Piloto Olalac × Arcor</small></header>
<main>
<section id="vCfg" class="card" hidden>
  <label for="nombre">Tu nombre</label><input id="nombre" type="text" placeholder="Ej. Federico">
  <label for="pin" style="margin-top:12px">PIN</label><input id="pin" type="tel" inputmode="numeric">
  <p class="mu" id="cfgMsg"></p><button class="big" id="guardar">Entrar</button>
</section>
<section id="vFoto" class="card" hidden>
  <label for="cliente">Cliente (código o nombre)</label><input id="cliente" type="text" placeholder="Ej. 003712 Almacén Don Pepe">
  <label style="margin-top:14px">Foto de la góndola</label>
  <label class="foto" id="zF"><input type="file" accept="image/*" capture="environment" id="fF">
    <span class="t">📷 Sacar foto de la góndola</span><span class="s">De frente, que entre todo el estante de golosinas / galletitas</span></label>
  <button class="big" id="enviar" disabled>ANALIZAR GÓNDOLA</button>
</section>
<section id="vEsp" class="card" hidden style="text-align:center"><div class="spin"></div><b>Analizando la góndola…</b><p class="mu">Tarda entre 10 y 30 segundos.</p></section>
<section id="vRes" hidden>
  <div class="card" id="res"></div>
  <button class="big" id="otro">Analizar otra góndola</button>
</section>
</main>
<script>
const URL_API = 'https://script.google.com/macros/s/AKfycbwO4L42T6elhJVeSKIGo2KdwEBrxBrosk8FUHOCXBejukrrslIs6I7WXA6U8P3AuTz4Dg/exec';
const $ = id => document.getElementById(id);
const ls = {get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let cfg = {nombre: ls.get('gon_nombre') || ls.get('chq_nombre'), pin: ls.get('gon_pin') || ls.get('chq_pin')}, foto = '';
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function ver(v){ ['vCfg','vFoto','vEsp','vRes'].forEach(x => $(x).hidden = x !== v); scrollTo(0,0); }
function inicio(){ $('quien').textContent = cfg.nombre ? 'Vendedor: ' + cfg.nombre : 'Piloto Olalac × Arcor'; ver(cfg.nombre && cfg.pin ? 'vFoto' : 'vCfg'); }
$('guardar').onclick = async () => {
  const n = $('nombre').value.trim(), p = $('pin').value.trim(); if (!n || !p) { $('cfgMsg').textContent = 'Completá nombre y PIN'; return; }
  try { const r = await (await fetch(URL_API, {method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({tipo:'ping', pin:p})})).json();
    if (!r.ok) { $('cfgMsg').textContent = r.error; return; } } catch (e) { $('cfgMsg').textContent = 'Sin conexión'; return; }
  cfg = {nombre:n, pin:p}; ls.set('gon_nombre', n); ls.set('gon_pin', p); inicio();
};
$('fF').onchange = () => {
  const f = $('fF').files[0]; if (!f) return; const fr = new FileReader();
  fr.onload = () => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, 2000 / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    const u = c.toDataURL('image/jpeg', 0.85); foto = u.split(',')[1];
    $('zF').querySelectorAll('img,.t,.s').forEach(e => e.remove()); $('zF').insertAdjacentHTML('beforeend', '<img alt="góndola"><span class="s">Tocá para sacarla de nuevo</span>');
    $('zF').querySelector('img').src = u; $('enviar').disabled = false; }; im.src = fr.result; };
  fr.readAsDataURL(f);
};
$('enviar').onclick = async () => {
  ver('vEsp');
  try {
    const r = await (await fetch(URL_API, {method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({tipo:'gondola', pin:cfg.pin, repartidor:cfg.nombre, cliente:$('cliente').value.trim(), foto})})).json();
    if (!r.ok) throw new Error(r.error || 'error');
    const g = r.gondola;
    if (!g.es_gondola || !g.legible) { $('res').innerHTML = '<b>📷 No se pudo analizar</b><p>' + esc(g.problema_foto || 'Sacá la foto de nuevo, de frente y con buena luz') + '</p>'; ver('vRes'); return; }
    const ms = (g.marcas || []).slice().sort((a, b) => b.frentes - a.frentes), mx = Math.max(1, ...ms.map(m => m.frentes));
    $('res').innerHTML = `<div class="share"><div class="n">${g.share_arcor}%</div><div class="l">share de góndola Arcor + Bagley · ${g.frentes_arcor} de ${g.total_frentes} frentes</div></div>
      <p class="mu" style="text-align:center">${esc(g.categoria || '')}</p>
      ${ms.map(m => `<div class="bar"><span class="nm">${esc(m.marca)}</span><span class="tr"><span class="fi ${m.grupo_arcor ? 'a' : ''}" style="width:${m.frentes / mx * 100}%;display:block"></span></span><span class="v">${m.frentes}</span></div>`).join('')}
      <p><span class="pill ${g.pop_arcor ? 'si' : 'no'}">${g.pop_arcor ? '✓' : '✗'} Material POP Arcor</span><span class="pill ${g.precios_visibles ? 'si' : 'no'}">${g.precios_visibles ? '✓' : '✗'} Precios visibles</span></p>
      ${(g.huecos || []).length ? '<b>Huecos / faltantes</b><ul>' + g.huecos.map(h => '<li>' + esc(h) + '</li>').join('') + '</ul>' : ''}
      ${g.observaciones ? '<p class="mu">' + esc(g.observaciones) + '</p>' : ''}
      ${(g.recomendaciones || []).length ? '<b>Qué hacer en este cliente</b><ul>' + g.recomendaciones.map(h => '<li>' + esc(h) + '</li>').join('') + '</ul>' : ''}`;
    ver('vRes');
  } catch (e) { $('res').innerHTML = '<b>Sin respuesta</b><p>' + esc(e.message) + '</p>'; ver('vRes'); }
};
$('otro').onclick = () => { foto = ''; $('enviar').disabled = true; $('fF').value = ''; $('zF').querySelectorAll('img,.s').forEach(e => e.remove());
  $('zF').insertAdjacentHTML('beforeend', '<span class="t">📷 Sacar foto de la góndola</span><span class="s">De frente, que entre todo el estante</span>'); $('cliente').value = ''; ver('vFoto'); };
inicio();
</script>
</body>
</html>
